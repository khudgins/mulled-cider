# Mulled Cider - Sway Window Colors
# A warm, autumnal color theme for the Sway window manager
# Based on the Mulled Cider VS Code theme
#
# Usage: include /path/to/sway-mulled-cider.conf

# Palette, exposed as variables so the rest of your config can reuse them
set $mc_bg0     #1F1612
set $mc_bg1     #241A16
set $mc_bg2     #2B1F1A
set $mc_surface #352520
set $mc_border  #3D2A22
set $mc_select  #5C3D2E
set $mc_text    #E8D5C4
set $mc_text_hi #F4D1A6
set $mc_gold    #D4A574
set $mc_rust    #B85C38
set $mc_rust_lt #C97D60
set $mc_green   #8B9A5B
set $mc_muted   #8B6F5E
set $mc_dim     #6B4E3A

# class                 border       background   text        indicator    child_border
client.focused          $mc_gold     $mc_gold     $mc_bg0     $mc_rust_lt  $mc_gold
client.focused_inactive $mc_select   $mc_surface  $mc_text    $mc_select   $mc_select
client.focused_tab_title $mc_select  $mc_surface  $mc_text_hi
client.unfocused        $mc_border   $mc_bg1      $mc_muted   $mc_border   $mc_border
client.urgent           $mc_rust     $mc_rust     $mc_text    $mc_rust     $mc_rust
client.placeholder      $mc_bg0      $mc_bg1      $mc_text    $mc_bg0      $mc_bg0
client.background       $mc_bg2
