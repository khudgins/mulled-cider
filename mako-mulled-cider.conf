# Mulled Cider - mako Notification Theme
# A warm, autumnal color theme for the mako notification daemon
# Based on the Mulled Cider VS Code theme
#
# Usage: add this as the LAST line of ~/.config/mako/config
#   include=/path/to/mako-mulled-cider.conf
# (it ends with [criteria] sections, which would capture any options after it)

background-color=#241A16
text-color=#E8D5C4
border-color=#D4A574
progress-color=over #5C3D2E
border-size=2
border-radius=6

[urgency=low]
border-color=#6B4E3A
text-color=#9B7E6B

[urgency=critical]
background-color=#2B1F1A
border-color=#B85C38
text-color=#F4D1A6
