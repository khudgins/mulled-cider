# Mulled Cider - swaylock Theme
# A warm, autumnal color theme for the swaylock screen locker
# Based on the Mulled Cider VS Code theme
#
# Usage: copy or symlink to ~/.config/swaylock/config,
#        or run: swaylock -C /path/to/swaylock-mulled-cider.conf

color=1F1612

indicator-radius=80
indicator-thickness=8

# Idle / typing
inside-color=241A16
ring-color=6B4E3A
key-hl-color=D4A574
bs-hl-color=C97D60
text-color=E8D5C4
line-uses-inside
separator-color=00000000

# Cleared input
inside-clear-color=241A16
ring-clear-color=A4B574
text-clear-color=A4B574

# Verifying
inside-ver-color=241A16
ring-ver-color=D4A574
text-ver-color=D4A574

# Wrong password
inside-wrong-color=2B1F1A
ring-wrong-color=B85C38
text-wrong-color=E89D7A

# Caps Lock
inside-caps-lock-color=241A16
ring-caps-lock-color=E89D7A
text-caps-lock-color=E89D7A
caps-lock-key-hl-color=F4D1A6
caps-lock-bs-hl-color=C97D60

# Keyboard layout badge
layout-bg-color=241A16
layout-border-color=6B4E3A
layout-text-color=E8D5C4
